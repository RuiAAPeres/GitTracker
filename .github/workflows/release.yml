name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build app artifacts
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Package arm64 bundle
        run: ./scripts/package-app.sh "${GITHUB_REF_NAME#v}" "arm64"

      - name: Package x86_64 bundle
        run: ./scripts/package-app.sh "${GITHUB_REF_NAME#v}" "x86_64"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitTracker-release-assets
          path: dist/*/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: GitTracker-release-assets
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check tap token
        id: tap-token
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout app repo
        if: ${{ steps.tap-token.outputs.enabled == 'true' }}
        uses: actions/checkout@v4

      - name: Download checksums
        if: ${{ steps.tap-token.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: GitTracker-release-assets
          path: release-assets
          merge-multiple: true

      - name: Checkout Homebrew tap repo
        if: ${{ steps.tap-token.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: RuiAAPeres/homebrew-gittracker
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        if: ${{ steps.tap-token.outputs.enabled == 'true' }}
        run: |
          ARM_SHA_FILE="$(find release-assets -name 'GitTracker-arm64.sha256' | head -n 1)"
          INTEL_SHA_FILE="$(find release-assets -name 'GitTracker-x86_64.sha256' | head -n 1)"
          if [ -z "$ARM_SHA_FILE" ] || [ -z "$INTEL_SHA_FILE" ]; then
            echo "Could not locate checksum files in release-assets"
            find release-assets -maxdepth 4 -type f
            exit 1
          fi
          ARM_SHA="$(cat "$ARM_SHA_FILE")"
          INTEL_SHA="$(cat "$INTEL_SHA_FILE")"
          ./scripts/update-homebrew-cask.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --arm-sha "$ARM_SHA" \
            --intel-sha "$INTEL_SHA" \
            --repo "${GITHUB_REPOSITORY}" \
            --output "tap/Casks/gittracker.rb"

      - name: Commit and push cask update
        if: ${{ steps.tap-token.outputs.enabled == 'true' }}
        run: |
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "No Homebrew cask changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gittracker.rb
          git commit -m "gittracker ${GITHUB_REF_NAME#v}"
          git push
